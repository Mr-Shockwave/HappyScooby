# Behavioral Archaeologist — RocketRide Pipeline (reference)
#
# CANONICAL VISUAL WORKFLOW: rocketride/behavioral-archaeologist.pipe
# Open that file in VS Code with the RocketRide extension to edit the graph visually.
#
# This YAML maps the .pipe components to the TypeScript orchestrator for documentation.
# DAG: ingestion → vision_analysis → psych_analysis → action_decision

name: behavioral-archaeologist-pipeline
version: "0.3.0"
canonical_pipe: rocketride/behavioral-archaeologist.pipe

metadata:
  sponsor: RocketRide
  orchestrator: rocketride/orchestrator.ts
  state_type: rocketride/types.ts
  triggers:
    - id: hardware_image_poll
      source: hardware-bridge/image-poller.ts
      forwards_to: webhook_1
      type: image
      interval_seconds: 10
    - id: photon_telegram_webhook
      source: photon/telegram-bot.ts
      forwards_to: webhook_1
      type: text

# Maps .pipe component IDs to TypeScript modules
component_map:
  webhook_1:
    stage: ingestion
    module: rocketride/nodes/ingestion.ts
  image_vision_openai_1:
    stage: vision_analysis
    module: rocketride/nodes/vision-analysis.ts
    butterbase: analyzeVisuals
  prompt_1:
    stage: psych_analysis_prep
    module: rocketride/nodes/psych-analysis.ts
  llm_anthropic_1:
    stage: psych_analysis
    module: rocketride/nodes/psych-analysis.ts
    butterbase: analyzePsychology
  response_answers_1:
    stage: action_decision
    module: rocketride/nodes/action-decision.ts

dag:
  edges:
    - from: webhook_1
      to: image_vision_openai_1
    - from: image_vision_openai_1
      to: prompt_1
    - from: webhook_1
      to: prompt_1
    - from: prompt_1
      to: llm_anthropic_1
    - from: llm_anthropic_1
      to: response_answers_1
